<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration System</title>
    <link href="registration_form.css" rel="stylesheet">
</head>
<body>
    <div class="information">
      <h1>School Registration System</h1>
      <div class="names">
        <label for="name" id="student">Enter Name of Student</label>
        <input type="text"  placeholder="eg.Ben Lee Again"  id="name" required> 
      </div>
      <div class="names">
        <label for="school">School Name</label>
        <input type="text" placeholder="Eg.xxx school" id="school" required>
      </div>
      <div class="names">
      <p id="text">Choose Gender of Student</p>
        <input type="radio" id="boy" name="gender" value="Male">
        <label for="boy">Male</label>
        <input type="radio" id="girl" name="gender" value="Female">
        <label for="girl">Female</label>
        <button type="submit" id="submit">Submit</button>
        <button type="reset" id="reset">Reset</button>
      </div>
      <div class="names paragraph">
        <p id="details"><a href="https://www.google.com">More Details</a></p>
      </div>
    </div>
</body>
</html>
